
<!doctype html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DubFlow — AI Video Dubbing</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d1020;color:#fff;font-family:system-ui;padding:20px}
main{max-width:650px;margin:auto}
h1{font-size:32px}
h1 span{color:#9d8cff}
.panel{background:#191d32;padding:22px;border-radius:18px;margin-top:22px}
label{display:block;margin-top:18px;margin-bottom:8px}
input,select,button{width:100%;padding:15px;border-radius:12px;font-size:16px}
select{background:#101428;color:white;border:1px solid #555}
input{background:#252a42;color:white}
button{background:#8977ff;color:white;border:0;font-weight:bold;margin-top:24px}
button:disabled{opacity:.5}
video{width:100%;margin-top:15px;border-radius:12px}
#status{margin-top:18px;line-height:1.6;overflow-wrap:anywhere}
a{color:#b7aaff}
small{color:#aeb3cb}
</style>
</head>
<body>
<main>
<h1>🎬 Dub<span>Flow</span></h1>
<p>നിങ്ങളുടെ വീഡിയോ നിങ്ങൾക്ക് ഇഷ്ടമുള്ള ഭാഷയിൽ!</p>

<div class="panel">
<label>1. വീഡിയോ തിരഞ്ഞെടുക്കുക</label>
<input type="file" id="videoFile" accept="video/*">

<video id="preview" controls hidden></video>

<label>2. Original Language</label>
<select id="source">
<option value="auto">Auto Detect</option>
<option value="ml">Malayalam</option>
<option value="en">English</option>
<option value="hi">Hindi</option>
<option value="ta">Tamil</option>
<option value="ar">Arabic</option>
</select>

<label>3. Dub Into</label>
<select id="target">
<option value="en">English</option>
<option value="ml">Malayalam</option>
<option value="hi">Hindi</option>
<option value="ta">Tamil</option>
<option value="ar">Arabic</option>
</select>

<button id="start">✨ Start AI Dubbing</button>
<div id="status">വീഡിയോ തിരഞ്ഞെടുക്കൂ.</div>
</div>
<small>DubFlow AI • Dubbing may use paid API credits.</small>
</main>

<script>
const BACKEND = "https://dubflow-ai-dubbing.onrender.com";
const fileInput = document.getElementById("videoFile");
const preview = document.getElementById("preview");
const statusBox = document.getElementById("status");
const startButton = document.getElementById("start");
let previewUrl;

fileInput.addEventListener("change", () => {
  const file = fileInput.files[0];
  if (!file) return;
  if (previewUrl) URL.revokeObjectURL(previewUrl);
  previewUrl = URL.createObjectURL(file);
  preview.src = previewUrl;
  preview.hidden = false;
  statusBox.textContent = "വീഡിയോ തയ്യാറാണ്.";
});

startButton.addEventListener("click", async () => {
  const file = fileInput.files[0];
  if (!file) {
    statusBox.textContent = "ആദ്യം വീഡിയോ തിരഞ്ഞെടുക്കൂ.";
    return;
  }

  const form = new FormData();
  form.append("video", file);
  form.append("source_lang", document.getElementById("source").value);
  form.append("target_lang", document.getElementById("target").value);

  startButton.disabled = true;
  statusBox.textContent = "AI Dubbing request അയയ്ക്കുന്നു...";

  try {
    const response = await fetch(BACKEND + "/api/dub", {
      method: "POST",
      body: form
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Dubbing request failed");
    }

    statusBox.textContent =
      "Dubbing request സ്വീകരിച്ചു. Job ID: " +
      (data.dubbing_id || data.id || "Not provided") +
      ". വീഡിയോ തയ്യാറാകുന്നത് പരിശോധിക്കാനും ഡൗൺലോഡ് ചെയ്യാനും അടുത്ത ഘട്ടം ബന്ധിപ്പിക്കണം.";

  } catch (error) {
    statusBox.textContent = "Error: " + error.message;
  } finally {
    startButton.disabled = false;
  }
});
</script>
</body>
</html>
