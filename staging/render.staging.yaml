# LOCAL PROPOSAL ONLY. Applying this creates a new service and requires approval.
services:
  - type: web
    name: dubflow-staging-disabled
    runtime: node
    plan: free
    repo: https://github.com/thahakp99-alt/dubflow-ai-dubbing
    branch: dubflow-staging-disabled
    autoDeployTrigger: "off"
    buildCommand: npm ci --ignore-scripts && npm test
    startCommand: node staging/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: DUBBING_ENABLED
        value: "false"
      - key: DUBFLOW_ACCESS_TOKEN
        generateValue: true
# ELEVENLABS_API_KEY intentionally absent. Do NOT attach production env groups.
# RENDER_EXTERNAL_URL is provided by Render; no production origin is inherited.
